name: Pages (main + feature preview)
# Publishes main at the site root and the feature branch at /preview/.
# Requires Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main, ccr-3efed2ec-2edmp8]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  PREVIEW_BRANCH: ccr-3efed2ec-2edmp8
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'art-brief' --exclude '.claude' main/ _site/
      - uses: actions/checkout@v4
        id: co_preview
        continue-on-error: true
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          path: preview
      - name: Add preview
        if: steps.co_preview.outcome == 'success'
        run: |
          mkdir -p _site/preview
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'art-brief' --exclude '.claude' preview/ _site/preview/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
